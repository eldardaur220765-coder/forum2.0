<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЧЕБУПЕЛИ | Форум</title>
<link rel="icon" href="logo.jpg">
<style>
  :root {
    --bg: #07050d;
    --panel: #100b1a;
    --panel-2: #160f24;
    --line: #2a1d45;
    --text: #e9e4f5;
    --muted: #8f84ab;
    --accent: #8b5cf6;
    --accent-hover: #a78bfa;
    --accent-soft: rgba(139, 92, 246, .13);
    --glow: rgba(139, 92, 246, .35);
    --ok: #3ecf8e;
    --danger: #f0577a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(124, 58, 237, .28), transparent 70%),
      radial-gradient(600px 400px at 100% 100%, rgba(88, 28, 135, .18), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }

  /* ===== ШАПКА ===== */
  header {
    background: rgba(12, 8, 20, .85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: .6;
  }
  .header-in {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px;
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; }
  .logo {
    position: relative;
    width: 42px; height: 42px;
    border-radius: 10px;
    background: linear-gradient(145deg, #7c3aed, #4c1d95);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 700;
    font-size: 18px;
    overflow: hidden;
    border: 1px solid rgba(139, 92, 246, .6);
    box-shadow: 0 0 18px var(--glow);
    flex-shrink: 0;
  }
  .logo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .brand b {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .04em;
    white-space: pre;
  }
  nav { display: flex; gap: 6px; }
  nav a {
    font-size: 14px;
    color: var(--muted);
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    transition: .15s;
  }
  nav a:hover, nav a.active { color: var(--text); background: var(--accent-soft); }

  /* ===== КОНТЕНТ ===== */
  main { max-width: 960px; width: 100%; margin: 0 auto; padding: 30px 20px 50px; flex: 1; }

  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 18px; }
  .crumbs a { cursor: pointer; text-decoration: none; }
  .crumbs a:hover { color: var(--accent-hover); }
  .crumbs i { margin: 0 8px; font-style: normal; opacity: .5; }

  .page-title {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 6px;
    letter-spacing: .01em;
    text-shadow: 0 0 24px rgba(139, 92, 246, .45);
  }
  .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 26px; }

  /* ===== КАТЕГОРИИ ===== */
  .category {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  .cat-head {
    padding: 12px 20px;
    background: linear-gradient(90deg, rgba(139, 92, 246, .14), transparent 70%), var(--panel-2);
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: #b9a8ea;
    display: flex;
    justify-content: space-between;
  }
  .cat-head span:last-child { color: var(--muted); }
  .topic {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .2s, box-shadow .2s;
    position: relative;
  }
  .topic:last-child { border-bottom: none; }
  .topic::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--accent);
    opacity: 0;
    transition: .2s;
    box-shadow: 0 0 12px var(--accent);
  }
  .topic:hover { background: var(--panel-2); }
  .topic:hover::before { opacity: 1; }
  .t-icon {
    width: 44px; height: 44px;
    border-radius: 9px;
    background: var(--accent-soft);
    border: 1px solid rgba(139, 92, 246, .3);
    color: var(--accent-hover);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .t-icon svg { width: 22px; height: 22px; }
  .t-info { flex: 1; min-width: 0; }
  .t-info h3 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .t-info p { font-size: 13.5px; color: var(--muted); }
  .t-meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .arrow { color: var(--muted); transition: .2s; }
  .topic:hover .arrow { color: var(--accent-hover); transform: translateX(3px); }

  .notice {
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    background: var(--panel);
    border-radius: 8px;
    font-size: 14px;
    color: var(--muted);
  }
  .notice b { color: var(--text); font-weight: 600; }

  /* ===== ПОСТ ===== */
  .post {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  .author {
    width: 170px;
    background: var(--panel-2);
    border-right: 1px solid var(--line);
    padding: 24px 14px;
    text-align: center;
    flex-shrink: 0;
  }
  .avatar {
    width: 60px; height: 60px;
    margin: 0 auto 12px;
    border-radius: 12px;
    background: var(--accent-soft);
    color: var(--accent-hover);
    display: grid; place-items: center;
    border: 1px solid rgba(139, 92, 246, .4);
    box-shadow: 0 0 20px rgba(139, 92, 246, .25);
  }
  .avatar svg { width: 28px; height: 28px; }
  .author b { display: block; font-size: 14px; font-weight: 600; }
  .author span {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--accent-hover);
  }
  .post-body { padding: 26px 28px; flex: 1; min-width: 0; }
  .post-body h3 { font-size: 19px; font-weight: 600; margin-bottom: 10px; }
  .post-body > p { color: var(--muted); font-size: 15px; margin-bottom: 18px; }

  .steps { list-style: none; counter-reset: s; margin-bottom: 22px; }
  .steps li {
    counter-increment: s;
    position: relative;
    padding: 8px 0 8px 40px;
    color: #c9c0e0;
    font-size: 14.5px;
  }
  .steps li::before {
    content: counter(s);
    position: absolute;
    left: 0; top: 7px;
    width: 26px; height: 26px;
    border-radius: 7px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--accent-hover);
    font-size: 13px;
    font-weight: 600;
    display: grid; place-items: center;
  }

  .link-box {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 18px;
  }
  .link-box small {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .link-box a {
    color: var(--accent-hover);
    font-family: Consolas, "Courier New", monospace;
    font-size: 13.5px;
    word-break: break-all;
    text-decoration: none;
  }
  .link-box a:hover { text-decoration: underline; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn {
    padding: 11px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: .2s;
    font-family: inherit;
  }
  .btn-main { background: linear-gradient(145deg, #8b5cf6, #6d28d9); color: #fff; }
  .btn-main:hover { box-shadow: 0 0 22px var(--glow); transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--line); }
  .btn-ghost:hover { background: var(--accent-soft); border-color: rgba(139, 92, 246, .5); }
  .btn-ghost.ok { color: var(--ok); border-color: var(--ok); }
  .back { margin-top: 20px; }

  /* ===== ПРАВИЛА ===== */
  .rules-group {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin: 4px 0 10px;
    font-weight: 600;
  }
  .rules { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
  .rule {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    transition: background .15s;
  }
  .rule:last-child { border-bottom: none; }
  .rule:hover { background: var(--panel-2); }
  .r-num {
    min-width: 42px;
    text-align: center;
    padding: 4px 0;
    border-radius: 6px;
    background: var(--accent-soft);
    border: 1px solid rgba(139, 92, 246, .3);
    color: var(--accent-hover);
    font-size: 13px;
    font-weight: 700;
    font-family: Consolas, monospace;
  }
  .r-text { flex: 1; font-size: 14.5px; color: #d8d0ec; }
  .r-pen {
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 6px;
    white-space: nowrap;
    border: 1px solid;
  }
  .r-pen.mute { color: #c4a9ff; border-color: rgba(139, 92, 246, .45); background: rgba(139, 92, 246, .1); }
  .r-pen.kick { color: var(--danger); border-color: rgba(240, 87, 122, .45); background: rgba(240, 87, 122, .09); }
  .r-pen.info { color: var(--muted); border-color: var(--line); background: transparent; }

  .warn {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 14px 18px;
    border: 1px solid rgba(240, 87, 122, .35);
    border-left: 3px solid var(--danger);
    background: rgba(240, 87, 122, .06);
    border-radius: 8px;
    font-size: 14px;
    color: #f1c7d1;
  }
  .warn svg { width: 22px; height: 22px; color: var(--danger); flex-shrink: 0; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    border-top: 1px solid var(--line);
  }

  .hidden { display: none; }

  @media (max-width: 640px) {
    .post { flex-direction: column; }
    .author {
      width: 100%;
      border-right: none;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 14px;
      text-align: left;
      padding: 14px 18px;
    }
    .avatar { margin: 0; width: 44px; height: 44px; }
    .avatar svg { width: 22px; height: 22px; }
    .post-body { padding: 20px 16px; }
    .t-meta { display: none; }
    nav { display: none; }
    .page-title { font-size: 23px; }
    .rule { flex-wrap: wrap; gap: 8px 12px; }
    .r-text { flex-basis: calc(100% - 60px); }
    .r-pen { margin-left: 54px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-in">
    <a class="brand" onclick="goHome()">
      <!-- Если картинка не загрузится, останется буква «Ч» -->
      <div class="logo">
        Ч
        <img src="logo.jpg" alt="" onerror="this.remove()">
      </div>
      <b id="groupName">ЧЕБУПЕЛИ   | Форум</b>
    </a>
    <nav>
      <a class="active" onclick="goHome()">Главная</a>
    </nav>
  </div>
</header>

<main>

  <!-- ГЛАВНАЯ -->
  <div id="viewHome">
    <div class="crumbs">Главная</div>
    <h1 class="page-title">Форум</h1>
    <p class="page-sub">Выберите раздел: подача заявлений или правила группы.</p>

    <div id="categories"></div>

    <div class="notice">
      <b>Важно:</b> заявления рассматривает руководство группы. Заполняйте все пункты честно, недостоверные данные ведут к отказу.
    </div>
  </div>

  <!-- ТЕМА -->
  <div id="viewTopic" class="hidden">
    <div class="crumbs">
      <a onclick="goHome()">Главная</a><i>/</i><span id="crumbTitle"></span>
    </div>

    <h1 class="page-title" id="thTitle"></h1>
    <p class="page-sub" id="thSub"></p>

    <div class="post">
      <div class="author">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <div>
          <b>Администрация</b>
          <span>Официально</span>
        </div>
      </div>
      <div class="post-body" id="postBody"></div>
    </div>

    <div class="back">
      <button class="btn btn-ghost" onclick="goHome()">← Назад к темам</button>
    </div>
  </div>

</main>

<footer id="footer"></footer>

<script>
  // ====== НАСТРОЙКИ ======
  const GROUP_NAME = "ЧЕБУПЕЛИ   | Форум";

  const ICONS = {
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>',
    up:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
    rules: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M9 9h6M9 12h6M9 15h3"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5M12 18h.01"/></svg>'
  };

  const CATEGORIES = [
    {
      name: "Заявления",
      topics: [
        {
          id: "roles",
          type: "link",
          icon: ICONS.doc,
          title: "Заявления на роли",
          desc: "Подача заявления на получение роли в группе.",
          link: "https://eldardaur220765-coder.github.io/Zayavkihh/zayavki.html",
          postTitle: "Как подать заявление на роль",
          postText: "Чтобы подать заявление на роль, перейдите по ссылке ниже и заполните анкету.",
          steps: [
            "Нажмите кнопку «Перейти по ссылке».",
            "Заполните все пункты анкеты честно и полностью.",
            "Скопируйте готовый текст заявления.",
            "Отправьте его руководству группы."
          ]
        },
        {
          id: "promotion",
          type: "link",
          icon: ICONS.up,
          title: "Заявления на повышение роли",
          desc: "Подача заявления на повышение, если выполнены все требования.",
          link: "https://eldardaur220765-coder.github.io/promotion/index.html",
          postTitle: "Как подать заявление на повышение",
          postText: "Перейдите по ссылке ниже, выберите роль, на которую идёте в повышение, и ответьте на вопросы по требованиям.",
          steps: [
            "Нажмите кнопку «Перейти по ссылке».",
            "Выберите роль, на которую идёте в повышение.",
            "Ответьте «Да» или «Нет» на все вопросы.",
            "Скопируйте готовый текст и отправьте Основателю, Владельцу или Заместителю Основателя."
          ]
        }
      ]
    },
    {
      name: "Информация",
      topics: [
        {
          id: "rules",
          type: "rules",
          icon: ICONS.rules,
          title: "Правила чата",
          desc: "Список нарушений и наказаний за них.",
          postTitle: "Правила чата",
          postText: "Незнание правил не освобождает от ответственности. Ниже указаны все нарушения и время наказания.",
          rules: [
            { n: "1.1", text: "Маты",                                          pen: "Мут 30 мин", t: "mute" },
            { n: "1.2", text: "Упоминание алкогольных напитков",               pen: "Мут 15 мин", t: "mute" },
            { n: "1.3", text: "Спам",                                          pen: "Мут 10 мин", t: "mute" },
            { n: "1.4", text: "Оскорбление",                                   pen: "Мут 35 мин", t: "mute" },
            { n: "1.5", text: "Оскорбление руководства",                       pen: "Мут 60 мин", t: "mute" },
            { n: "1.6", text: "Фото, видео, содержащие контент 18+",           pen: "Мут 40 мин", t: "mute" },
            { n: "1.7", text: "Добавление ботов",                              pen: "Кик 15 мин", t: "kick" },
            { n: "1.8", text: "Отправление ссылок",                            pen: "Мут 15 мин", t: "mute" },
            { n: "1.9", text: "Темы с насилием и расчленением",                pen: "Мут 30 мин", t: "mute" },
            { n: "2.0", text: "Осуждение за внешность, ориентацию",            pen: "Мут 45 мин", t: "mute" },
            { n: "2.1", text: "Опросы создают только с роли Модератор и выше", pen: "Правило",    t: "info" },
            { n: "2.2", text: "Угроза в реальной жизни",                       pen: "Мут 25 мин", t: "mute" }
          ],
          warning: "За нарушение будет выдаваться мут на определённое время."
        }
      ]
    }
  ];

  // ====== КОД ======
  const $ = id => document.getElementById(id);
  const ALL = CATEGORIES.flatMap(c => c.topics);

  document.title = GROUP_NAME.replace(/\s+/g, " ");
  $("groupName").textContent = GROUP_NAME;
  $("footer").textContent = "© " + new Date().getFullYear() + " " + GROUP_NAME.replace(/\s+/g, " ");

  // Главная: категории и темы
  const catBox = $("categories");
  CATEGORIES.forEach(cat => {
    const wrap = document.createElement("div");
    wrap.className = "category";
    wrap.innerHTML = `<div class="cat-head"><span>${cat.name}</span><span>Тем: ${cat.topics.length}</span></div>`;
    cat.topics.forEach(t => {
      const num = ALL.indexOf(t) + 1;
      const el = document.createElement("div");
      el.className = "topic";
      el.innerHTML = `
        <div class="t-icon">${t.icon}</div>
        <div class="t-info">
          <h3>${t.title}</h3>
          <p>${t.desc}</p>
        </div>
        <div class="t-meta">Тема ${num}</div>
        <div class="arrow">→</div>`;
      el.onclick = () => { location.hash = t.id; };
      wrap.appendChild(el);
    });
    catBox.appendChild(wrap);
  });

  function goHome() { location.hash = ""; }

  function renderLinkPost(t) {
    $("postBody").innerHTML = `
      <h3>${t.postTitle}</h3>
      <p>${t.postText}</p>
      <ol class="steps">${t.steps.map(s => `<li>${s}</li>`).join("")}</ol>
      <div class="link-box">
        <small>Ссылка</small>
        <a href="${t.link}" target="_blank" rel="noopener">${t.link}</a>
      </div>
      <div class="actions">
        <a class="btn btn-main" href="${t.link}" target="_blank" rel="noopener">Перейти по ссылке →</a>
        <button class="btn btn-ghost" id="btnCopy">Копировать ссылку</button>
      </div>`;

    const btn = $("btnCopy");
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(t.link); }
      catch (e) {
        const tmp = document.createElement("textarea");
        tmp.value = t.link;
        document.body.appendChild(tmp);
        tmp.select();
        document.execCommand("copy");
        tmp.remove();
      }
      btn.className = "btn btn-ghost ok";
      btn.textContent = "✓ Скопировано";
      setTimeout(() => {
        btn.className = "btn btn-ghost";
        btn.textContent = "Копировать ссылку";
      }, 2000);
    };
  }

  function renderRulesPost(t) {
    $("postBody").innerHTML = `
      <h3>${t.postTitle}</h3>
      <p>${t.postText}</p>
      <div class="rules-group">Нарушения и наказания</div>
      <div class="rules">
        ${t.rules.map(r => `
          <div class="rule">
            <div class="r-num">${r.n}</div>
            <div class="r-text">${r.text}</div>
            <div class="r-pen ${r.t}">${r.pen}</div>
          </div>`).join("")}
      </div>
      <div class="warn">${ICONS.warn}<div>${t.warning}</div></div>`;
  }

  function openTopic(t, index) {
    $("crumbTitle").textContent = t.title;
    $("thTitle").textContent = t.title;
    $("thSub").textContent = "Тема " + (index + 1);

    if (t.type === "rules") renderRulesPost(t);
    else renderLinkPost(t);

    $("viewHome").classList.add("hidden");
    $("viewTopic").classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  function route() {
    const id = location.hash.replace("#", "");
    const index = ALL.findIndex(t => t.id === id);
    if (index === -1) {
      $("viewTopic").classList.add("hidden");
      $("viewHome").classList.remove("hidden");
    } else {
      openTopic(ALL[index], index);
    }
  }

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
